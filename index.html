<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.1.2/dist/axios.min.js"></script>
    <title>Weather8-App</title>
</head>
<body>
    <div class="weather-app">
    <header>
        <form class="search-form" id="search-form">
        <input type="search" placeholder="Enter a City.." required id="search-form-input" class="search-form-input" />
        <input type="submit" value="Search" class="search-form-button" />
    </form>
    </header>
    <main>
        <div class="weather-app-data">
            <div>
                <h1 class="city" id="city">Paris</h1>
                <p class="details" id="details">
                    <span id="time"></span>,
                    <span id="info"></span>
                    <br />
                    Humidity:  <strong id="humidity"></strong>, Wind: <strong id="wind-speed"></strong>
                </p>
            </div>
            <div class="temperature-container">
            <div id="icon"></div>
            <div class="weather-app-temperature" id="temperature"></div>
            <div class="weather-app-unit">0C</div>
            </div>
        </div>
        <div class="weather-forecast" id="forecast"></div>
    </main>
   
    <footer>
        <p>  
        <em>
        This project was Coded by 
        <a href="https://github.com/AuntyIso/" target="_blank">Grace Care,</a>
        open source code hosted on
        <a href="https://github.com" target="_blank">Github</a>
        and website hosted on
        <a href="https://app.netlify.com" target="_blank">Netlify.</a>
        </em>
        </p>
     </footer> 
    </div>
     <script src="src/index.js"></script>
</body>
</html>
